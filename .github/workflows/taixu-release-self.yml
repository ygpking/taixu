name: Build TaiXu Release (Self-Signed)

# 自签正式版：applicationId=top.wkbin.taixu（不设 TAIXU_DEV_BUILD），
# 用 fork secret RELEASE_KEYSTORE（自签 keystore）签名，可长期同 key 无缝升级。
# 首次安装需先卸载官方 TaiXu（同包名不同签名无法共存），之后覆盖升级保留数据。
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional Release Tag (e.g. v0.14.0-self)'
        required: false
        default: ''
  # 打 tag（形如 v0.13.3-self）即自动构建自签正式版，无需 token 手动 dispatch。
  push:
    tags:
      - 'v*-self'

jobs:
  build:
    name: Build & Sign TaiXu Release (self)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Google 已于 2026-09-15 下架 Android SDK 的 `tools` 包，而 setup-android 的
          # packages 默认值是 'tools platform-tools'，导致 sdkmanager 安装 tools 时 exit 1，
          # 整个 job 挂在 "Set up Android SDK" 这一步（与业务代码无关）。
          # 显式只装 platform-tools，绕过已下架的 tools 包。与 unit-tests.yml / taixudev-build.yml 保持一致。
          packages: 'platform-tools'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Decode self-signed keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 -d > release-keystore.jks
          ls -la release-keystore.jks

      - name: Build release APK (正式 applicationId + 自签)
        env:
          # 不设 TAIXU_DEV_BUILD → applicationId = top.wkbin.taixu（正式，非 .dev）
          TAIXU_RELEASE_STORE_FILE: release-keystore.jks
          TAIXU_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          TAIXU_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          TAIXU_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -o pipefail
          # gradle.properties 默认只给 1GB 堆（-Xmx1024m）、Kotlin 512MB；
          # 自 v0.15.0 合并上游后模块数/代码量大增，R8 压缩阶段在 CI（7GB runner）
          # 下会因堆不足失败（本地需 4GB 才能编过）。此处显式提高，与本地验证一致。
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8" \
            -Pkotlin.daemon.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=768m" \
            2>&1 | tee /tmp/assemble.log

      - name: Publish build failure summary
        if: failure()
        run: |
          {
            echo "## 编译失败摘要"
            echo '```'
            grep -nE '^e: |error:|FAILED|What went wrong|> Task .* FAILED|Execution failed' /tmp/assemble.log | head -80 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # 同时把原始日志尾部贴进 summary：job summary 需登录才能看，
          # 而本环境只有写权限的 deploy key。摘要足够定位即可。
          {
            echo "## 原始日志尾部（最后 120 行）"
            echo '```'
            tail -120 /tmp/assemble.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # 提交到独立分支：无 token 环境可直接 git 读取（与 unit-tests.yml 同款机制）
          cp /tmp/assemble.log /tmp/ci-assemble-report.txt
          git config user.name "taixu-ci-bot"
          git config user.email "ci@taixu.local"
          git checkout -B ci-release-self-report
          cp /tmp/ci-assemble-report.txt ci-release-self-report.txt
          git add -f ci-release-self-report.txt
          git commit -m "ci: release-self 失败日志 ${GITHUB_SHA::8}" || true
          git push -f origin ci-release-self-report || true

      - name: Identify and Rename Output APK
        run: |
          mkdir -p output
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -n 1)
          [ -z "$APK_PATH" ] && APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" output/TaiXu-arm64-release-self.apk
            sha256sum output/TaiXu-arm64-release-self.apk > output/TaiXu-arm64-release-self.apk.sha256
            echo "APK ready: output/TaiXu-arm64-release-self.apk"
          else
            echo "Error: No release APK generated!" && exit 1
          fi

      - name: Verify Signature (apksigner)
        run: |
          APK=output/TaiXu-arm64-release-self.apk
          BT_DIR=$(ls -d /usr/local/lib/android/sdk/build-tools/*/ 2>/dev/null | sort -V | tail -n 1)
          echo "build-tools dir: $BT_DIR"
          if [ -n "$BT_DIR" ] && [ -x "$BT_DIR/apksigner" ]; then
            "$BT_DIR/apksigner" verify --print-certs "$APK" && echo "SIGNATURE OK (自签 keystore)"
          else
            echo "apksigner 不可用，跳过签名校验（仍出包）"
          fi

      - name: Upload TaiXu Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: taixu-release-self
          path: output/*
          retention-days: 7
