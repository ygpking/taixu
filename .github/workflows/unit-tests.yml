name: Unit Tests

# 仓库此前没有任何跑测试的 workflow（taixudev-build 只 assembleDebug、release 只 assembleRelease），
# 导致 harness/runtime/feature 的 JVM 单测从未在 CI 上真实执行过。
# TaiXu 的 PRoot 沙箱内 gradle 完全不可用，单测只能在这里（云端）验证。
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run JVM unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Google 已于 2026-09-15 下架 Android SDK 的 `tools` 包，而 setup-android 的
          # packages 默认值是 'tools platform-tools'，导致 sdkmanager 安装 tools 时 exit 1，
          # 整个 job 挂在 "Set up Android SDK" 这一步（与业务代码无关）。
          # 显式只装 platform-tools，绕过已下架的 tools 包。
          packages: 'platform-tools'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: 因果链闭环审计（静态检查，无需 Gradle）
        run: |
          set -o pipefail
          # 先自检：证明 P0 通路真的会亮、退出码契约没被改坏。
          # 没有这一步时，"P0 = 0" 可能只是"检测器坏了"而看起来一样（静默失败）。
          python3 scripts/causal_chain_audit.py --selftest
          # 脚本本身以退出码表达结论：0=无 P0，1=存在 P0，2=用法错误。
          # 直接把退出码当门禁，不再从 stdout 里 grep 严重度字符串——
          # 旧写法 `grep -q 'P0_'` 是**永不成立**的判据（脚本从不输出 "P0_" 这个字面量，
          # 它打印的是 `[P0] R3_combine_swallow_updates`），且被 `|| true` 兜住，
          # 于是这道自称"必须为 0"的门禁从上线起就从未拦截过任何提交
          # （实测：故意植入 R3 命中的探针文件，脚本 exit 1，而该步骤仍判定 success）。
          python3 scripts/causal_chain_audit.py --root . --no-tests --json audit-report.json | tee /tmp/audit.log
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 1 ]; then
            echo "::error::存在 P0 级因果链缺陷（详见 /tmp/audit.log 与 audit-report.json）"
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "::error::因果链审计脚本自身失败（退出码 $status），不代表「没有缺陷」"
            exit 1
          fi

      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --no-daemon --stacktrace --continue 2>&1 | tee /tmp/unit-test.log

      - name: Publish failure summary
        if: failure()
        run: |
          echo "## 单测/编译失败摘要"
          {
            echo "=== 编译/测试错误（前 80 行）==="
            grep -nE '^e: |error:|FAILED|What went wrong|> Task .* FAILED|Execution failed' /tmp/unit-test.log | head -80 || true
            echo
            echo "=== 全文尾部 150 行 ==="
            tail -150 /tmp/unit-test.log || true
          } > /tmp/failure-report.txt
          cat /tmp/failure-report.txt
          # 把报告提交回仓库（独立分支），供无 token 环境 git 读取
          git config user.name "taixu-ci-bot"
          git config user.email "ci@taixu.local"
          git checkout -B ci-failure-report
          cp /tmp/failure-report.txt ci-failure-report.txt
          git add -f ci-failure-report.txt
          git commit -m "ci: 失败报告 ${GITHUB_SHA::8}" || true
          git push -f origin ci-failure-report || true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            **/build/reports/tests
            **/build/test-results
          if-no-files-found: warn
          retention-days: 14
