name: Unit Tests

# 仓库此前没有任何跑测试的 workflow（taixudev-build 只 assembleDebug、release 只 assembleRelease），
# 导致 harness/runtime/feature 的 JVM 单测从未在 CI 上真实执行过。
# TaiXu 的 PRoot 沙箱内 gradle 完全不可用，单测只能在这里（云端）验证。
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run JVM unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Google 已于 2026-09-15 下架 Android SDK 的 `tools` 包，而 setup-android 的
          # packages 默认值是 'tools platform-tools'，导致 sdkmanager 安装 tools 时 exit 1，
          # 整个 job 挂在 "Set up Android SDK" 这一步（与业务代码无关）。
          # 显式只装 platform-tools，绕过已下架的 tools 包。
          packages: 'platform-tools'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: 因果链闭环审计（静态检查，无需 Gradle）
        run: |
          set -o pipefail
          python3 scripts/causal_chain_audit.py --root . --no-tests --json audit-report.json | tee /tmp/audit.log
          # P0 = StateFlow 误用 / combine 吞更新 等会直接导致行为缺陷的问题，必须为 0。
          # 脚本以退出码 1 表示存在 P0；其余级别仅记录不阻断。
          grep -q 'P0_' /tmp/audit.log && { echo "::error::存在 P0 级因果链缺陷"; exit 1; } || true

      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --no-daemon --stacktrace --continue 2>&1 | tee /tmp/unit-test.log

      - name: Publish failure summary
        if: failure()
        run: |
          echo "## 单测/编译失败摘要"
          {
            echo "=== 编译/测试错误（前 80 行）==="
            grep -nE '^e: |error:|FAILED|What went wrong|> Task .* FAILED|Execution failed' /tmp/unit-test.log | head -80 || true
            echo
            echo "=== 全文尾部 150 行 ==="
            tail -150 /tmp/unit-test.log || true
          } > /tmp/failure-report.txt
          cat /tmp/failure-report.txt
          # 把报告提交回仓库（独立分支），供无 token 环境 git 读取
          git config user.name "taixu-ci-bot"
          git config user.email "ci@taixu.local"
          git checkout -B ci-failure-report
          cp /tmp/failure-report.txt ci-failure-report.txt
          git add -f ci-failure-report.txt
          git commit -m "ci: 失败报告 ${GITHUB_SHA::8}" || true
          git push -f origin ci-failure-report || true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            **/build/reports/tests
            **/build/test-results
          if-no-files-found: warn
          retention-days: 14
