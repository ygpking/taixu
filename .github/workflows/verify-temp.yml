name: Verify (temp branch CI)

on:
  push:
    branches: ['fix/**', 'upstream/**']

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Compile & Unit Tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon --continue 2>&1 | tee /tmp/unit-test.log
      - name: 测试统计
        if: always()
        run: |
          find . -path "*/test-results/*" -name "TEST-*Skill*.xml" -o -path "*/test-results/*" -name "TEST-*skill*.xml" 2>/dev/null | while read -r f; do
            echo "  $(basename "$f"): $(grep -o 'tests="[0-9]*"' "$f" | head -1) $(grep -o 'failures="[0-9]*"' "$f" | head -1)"
          done
